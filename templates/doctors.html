<!DOCTYPE html>
<html>

<head>
    <title>Doctor Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            color: #1976d2;
        }

        .box {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 11px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-form input {
            flex: 1;
        }

        .clear-btn {
            background: #555;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

        .edit-btn {
            background: #198754;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Doctor Management</h1>

    <!-- ADD DOCTOR -->

    <div class="box">

        <h2>Add Doctor</h2>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Doctor Name"
                required
            >

            <input
                type="text"
                name="specialization"
                placeholder="Specialization"
                required
            >

            <input
                type="text"
                name="phone"
                placeholder="Phone"
            >

            <input
                type="number"
                name="experience"
                placeholder="Experience in Years"
                min="0"
            >

            <button type="submit">
                Add Doctor
            </button>

        </form>

    </div>


    <!-- SEARCH DOCTORS -->

    <div class="box">

        <h2>Search Doctors</h2>

        <form method="GET" class="search-form">

            <input
                type="text"
                name="search"
                placeholder="Search by name, specialization or phone"
                value="{{ search }}"
            >

            <button type="submit">
                Search
            </button>

            <a
                href="{{ url_for('doctor_management') }}"
                class="clear-btn">
                Clear
            </a>

        </form>

    </div>


    <!-- DOCTOR LIST -->

    <div class="box">

        <h2>Doctor List</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialization</th>
                <th>Phone</th>
                <th>Experience</th>
                <th>Action</th>
            </tr>

            {% for doctor in doctors %}

            <tr>

                <td>{{ doctor.id }}</td>

                <td>{{ doctor.name }}</td>

                <td>{{ doctor.specialization }}</td>

                <td>{{ doctor.phone }}</td>

                <td>{{ doctor.experience }} Years</td>

                <td>

                    <a
                        href="{{ url_for('edit_doctor', doctor_id=doctor.id) }}"
                        class="edit-btn">
                        Edit
                    </a>

                    <a
                        href="{{ url_for('delete_doctor', doctor_id=doctor.id) }}"
                        class="delete-btn"
                        onclick="return confirm('Are you sure you want to delete this doctor?');">
                        Delete
                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>


    <a
        href="{{ url_for('dashboard') }}"
        class="back-btn">
        Back to Dashboard
    </a>

</div>

</body>
</html>
